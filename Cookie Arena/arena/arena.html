    <link rel="stylesheet" href="../style/ui.css">
    <link rel="stylesheet" href="../style/static.css">

    <link rel="icon" type="image/x-icon" href="../img/cookie.ico">

<body ontouchstart="">
    <div id="opona"></div>
    <div class="content" id="arenaImg" style="
        background-image: url('../img/arena/green\ arena.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        width: 100%;
        height: 100%;">
        <div class="hp-container">
            <div class="hp-bar" style="width: 20%;" id="HpBar"></div>
        </div>
        <div class="divwidth">
            <button class="button-disabled" id="HpLabel">HP: 100/100</button>
            <button id="timerButton">30</button>
        </div>

        <div id="clicker-container">
            <img src="../img/skins/default/cookie 300x300.png" alt="" id="skin-img" class="spinning" height="0px">
        </div>
        <div id="skins-container"></div>
        
        <div id="notification" style="width: 280px;">
            <div class="divwidth" style="gap: 8px;">
                <img src="../img/ui/trophy.png" class="skin-img" style="height: 60px;">
                <div class="divheight">
                    <h4>Achievement unlocked!</h4>   
                    <p id="notificationp">Hello</p>
                </div>      
            </div>
        </div>
    </div>
    
    <script src="../leveldata.js"></script>
    <script>
const opona = document.getElementById('opona');

// Roztmívání při startu (bude trvat 2 sekundy)
window.onload = () => opona.style.opacity = '0';
    </script>
    <script src="../js/common.js"></script>
